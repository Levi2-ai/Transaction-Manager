appId: com.electron.erp
productName: ERP
files:
  - "dist/**"
  - "electron.cjs"
  - "preload.js"
  - "package.json"
  - "server/**"
  - "!node_modules/.bin/*"

directories:
  output: release
  buildResources: resources

win:
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
